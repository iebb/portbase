name: PortSQL
configs:
  Debug: debug
  Release: release
  Release-CI: release
schemes:
  PortbaseMacCI:
    build:
      targets:
        PortbaseMac: all
    archive:
      config: Release-CI
  PortSQLCI:
    build:
      targets:
        PortSQL: all
    archive:
      config: Release-CI
  PortbaseMac:
    build:
      targets:
        PortbaseMac: all
    test:
      targets:
        - PortbaseMacTests
  PortSQL:
    build:
      targets:
        PortSQL: all
    test:
      targets:
        - PortSQLTests
      environmentVariables:
        PORTBASE_TEST_HTTP_CA_B64: $(PORTBASE_TEST_HTTP_CA_B64)
        PORTBASE_TEST_HTTP_TLS_PORT: $(PORTBASE_TEST_HTTP_TLS_PORT)
        PORTBASE_TEST_REDIS_CA_B64: $(PORTBASE_TEST_REDIS_CA_B64)
        PORTBASE_TEST_REDIS_TLS_PORT: $(PORTBASE_TEST_REDIS_TLS_PORT)
        PORTBASE_TEST_ELASTICSEARCH_PORT: $(PORTBASE_TEST_ELASTICSEARCH_PORT)
        PORTBASE_TEST_CLICKHOUSE_PORT: $(PORTBASE_TEST_CLICKHOUSE_PORT)
        PORTBASE_TEST_MARIADB_PORT: $(PORTBASE_TEST_MARIADB_PORT)
        PORTBASE_TEST_REDIS_PASSWORD: $(PORTBASE_TEST_REDIS_PASSWORD)
        PORTBASE_TEST_REDIS_PORT: $(PORTBASE_TEST_REDIS_PORT)
        PORTSQL_TEST_MONGODB_PORT: $(PORTSQL_TEST_MONGODB_PORT)
        PORTSQL_TEST_MONGODB_REPLICA_PORT: $(PORTSQL_TEST_MONGODB_REPLICA_PORT)
        PORTSQL_TEST_MYSQL_PORT: $(PORTSQL_TEST_MYSQL_PORT)
        PORTSQL_TEST_POSTGRES_PORT: $(PORTSQL_TEST_POSTGRES_PORT)
        PORTSQL_TEST_MONGODB_TLS_PORT: $(PORTSQL_TEST_MONGODB_TLS_PORT)
        PORTSQL_TEST_MONGODB_CA_B64: $(PORTSQL_TEST_MONGODB_CA_B64)
options:
  bundleIdPrefix: ad.neko
packages:
  MongoKitten:
    url: https://github.com/orlandos-nl/MongoKitten.git
    exactVersion: 7.16.3
  SwiftBSON:
    url: https://github.com/mongodb/swift-bson.git
    revision: 3b9a8d2f9f24846c8285e643acd542404ae4cc7e
  DNSClient:
    # 2.6.1 raises its iOS minimum above MongoClient's declared deployment target.
    url: https://github.com/orlandos-nl/DNSClient.git
    exactVersion: 2.6.0
  MySQLNIO:
    path: Packages/mysql-nio
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio.git
    revision: f294b6205defeb23dc04c4e094b04f0de5784d4b
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.11.0
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.98.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: 4.4.0
targets:
  PortSQL:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PortSQL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.portsql
        PRODUCT_NAME: PortSQL
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SWIFT_OBJC_BRIDGING_HEADER: PortSQL/PortSQL-Bridging-Header.h
        DEVELOPMENT_TEAM: 7P8CLHDH5G
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"PortSQL/Preview Content\""
        CODE_SIGN_ENTITLEMENTS: PortSQL/PortSQL.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portbase
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      configs:
        Release:
          # Preserve the current transferred-app signing choice explicitly.
          CODE_SIGN_ENTITLEMENTS: PortSQL/PortSQL.entitlements
    dependencies:
      - package: MongoKitten
        product: MongoClient
      - package: SwiftBSON
        product: SwiftBSON
      - package: MySQLNIO
        product: MySQLNIO
      - package: PostgresNIO
        product: PostgresNIO
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftNIO
        product: NIOHTTP1
      - sdk: libsqlite3.tbd
      - sdk: Charts.framework
  PortSQLTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PortSQLTests
    dependencies:
      - target: PortSQL
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftCrypto
        product: Crypto

  PortbaseMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PortSQL
      - path: PortbaseMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.portsql
        PRODUCT_NAME: Portbase
        PRODUCT_MODULE_NAME: PortSQL
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SWIFT_OBJC_BRIDGING_HEADER: PortSQL/PortSQL-Bridging-Header.h
        DEVELOPMENT_TEAM: 7P8CLHDH5G
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: PortbaseMac/PortbaseMac.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_INCOMING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readwrite
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portbase
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Portbase connects to database servers on your local network.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Portbase Mac App Store
          ONLY_ACTIVE_ARCH: NO
        Release-CI:
          CODE_SIGN_STYLE: Automatic
          ONLY_ACTIVE_ARCH: NO
    dependencies:
      - package: MongoKitten
        product: MongoClient
      - package: SwiftBSON
        product: SwiftBSON
      - package: MySQLNIO
        product: MySQLNIO
      - package: PostgresNIO
        product: PostgresNIO
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - package: SwiftNIO
        product: NIOHTTP1
      - sdk: libsqlite3.tbd
      - sdk: Charts.framework

  PortbaseMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: PortSQLTests
        excludes:
          - ProductUIStateTests.swift
    settings:
      base:
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Portbase.app/Contents/MacOS/Portbase
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: PortbaseMac
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftCrypto
        product: Crypto
