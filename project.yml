name: PortSQL
options:
  bundleIdPrefix: ad.neko
packages:
  MySQLNIO:
    path: Packages/mysql-nio
  PostgresNIO:
    url: https://github.com/vapor/postgres-nio.git
    revision: f294b6205defeb23dc04c4e094b04f0de5784d4b
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: 0.11.0
  SwiftNIO:
    url: https://github.com/apple/swift-nio.git
    from: 2.98.0
  SwiftCrypto:
    url: https://github.com/apple/swift-crypto.git
    from: 4.4.0
targets:
  PortSQL:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PortSQL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ad.neko.portsql
        PRODUCT_NAME: PortSQL
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        DEVELOPMENT_TEAM: 7P8CLHDH5G
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"PortSQL/Preview Content\""
        CODE_SIGN_ENTITLEMENTS: PortSQL/PortSQL.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PortSQL
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: MySQLNIO
        product: MySQLNIO
      - package: PostgresNIO
        product: PostgresNIO
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftCrypto
        product: Crypto
      - sdk: Charts.framework
  PortSQLTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: PortSQLTests
    dependencies:
      - target: PortSQL
      - package: NIOSSH
        product: NIOSSH
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOPosix
      - package: SwiftCrypto
        product: Crypto
