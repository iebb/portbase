name: PortSQL nightly TestFlight

on:
  schedule:
    # 00:17 Asia/Tokyo. An off-hour minute reduces scheduled-run delays.
    - cron: "17 15 * * *"
  workflow_dispatch:
    inputs:
      force_upload:
        description: Upload even when this commit was already uploaded
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: portsql-nightly-testflight
  cancel-in-progress: false

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      should_upload: ${{ steps.check.outputs.should_upload }}
    steps:
      - name: Compare with the last successful nightly run
        id: check
        shell: bash
        env:
          FORCE_UPLOAD: ${{ inputs.force_upload || false }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          previous_sha="$({
            curl --fail --silent --show-error --get \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data-urlencode "branch=master" \
              --data-urlencode "status=success" \
              --data-urlencode "per_page=1" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/nightly-testflight.yml/runs"
          } | jq -r '.workflow_runs[0].head_sha // empty')"

          if [[ "${FORCE_UPLOAD}" == "true" ]]; then
            echo "Manual upload was forced."
            should_upload=true
          elif [[ -n "${previous_sha}" && "${previous_sha}" == "${GITHUB_SHA}" ]]; then
            echo "No commits since the last successful run (${GITHUB_SHA:0:7})."
            should_upload=false
          else
            echo "A new commit is available (${GITHUB_SHA:0:7})."
            should_upload=true
          fi

          echo "should_upload=${should_upload}" >> "${GITHUB_OUTPUT}"

  upload:
    name: Archive and upload
    needs: changes
    if: ${{ needs.changes.outputs.should_upload == 'true' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Apple signing certificates
        shell: bash
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64}" || -z "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD}" ]]; then
            echo "::error::Configure the Kitta signing bundle in APPLE_DISTRIBUTION_CERTIFICATE_BASE64 and APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD."
            exit 1
          fi

          certificate_path="${RUNNER_TEMP}/KittaDistribution.p12"
          keychain_path="${RUNNER_TEMP}/portsql-signing.keychain-db"
          keychain_password="$(/usr/bin/openssl rand -hex 32)"
          echo "SIGNING_CERTIFICATE_PATH=${certificate_path}" >> "${GITHUB_ENV}"
          echo "SIGNING_KEYCHAIN_PATH=${keychain_path}" >> "${GITHUB_ENV}"

          umask 077
          printf '%s' "${APPLE_DISTRIBUTION_CERTIFICATE_BASE64}" | /usr/bin/base64 -D > "${certificate_path}"
          /usr/bin/security create-keychain -p "${keychain_password}" "${keychain_path}"
          /usr/bin/security set-keychain-settings -lut 21600 "${keychain_path}"
          /usr/bin/security unlock-keychain -p "${keychain_password}" "${keychain_path}"
          /usr/bin/security import "${certificate_path}" \
            -P "${APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${keychain_path}"
          /usr/bin/security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "${keychain_password}" \
            "${keychain_path}"
          /usr/bin/security list-keychains -d user -s "${keychain_path}"

          identities="$(/usr/bin/security find-identity -v -p codesigning "${keychain_path}")"
          if ! printf '%s\n' "${identities}" | /usr/bin/grep -q 'Apple Development: hue ieb (7GGWUUWHQP)' || \
             ! printf '%s\n' "${identities}" | /usr/bin/grep -q 'Apple Distribution: Kitta Ltd (7P8CLHDH5G)'; then
            echo "::error::The configured bundle must contain the Kitta development and distribution identities."
            exit 1
          fi

      - name: Prepare App Store Connect credentials
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${ASC_ISSUER_ID}" || -z "${ASC_KEY_ID}" || -z "${ASC_PRIVATE_KEY_BASE64}" ]]; then
            echo "::error::Configure ASC_ISSUER_ID, ASC_KEY_ID, and ASC_PRIVATE_KEY_BASE64 as repository Actions secrets."
            exit 1
          fi

          auth_key_path="${RUNNER_TEMP}/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_AUTH_KEY_PATH=${auth_key_path}" >> "${GITHUB_ENV}"
          umask 077
          printf '%s' "${ASC_PRIVATE_KEY_BASE64}" | /usr/bin/base64 -D > "${auth_key_path}"

          if ! /usr/bin/openssl pkey -in "${auth_key_path}" -noout >/dev/null 2>&1; then
            echo "::error::ASC_PRIVATE_KEY_BASE64 did not decode to a valid App Store Connect private key."
            exit 1
          fi

      - name: Create TestFlight export options
        shell: bash
        run: |
          set -euo pipefail

          export_options="${RUNNER_TEMP}/ExportOptions.plist"
          /usr/bin/plutil -create xml1 "${export_options}"
          /usr/bin/plutil -insert destination -string upload "${export_options}"
          /usr/bin/plutil -insert manageAppVersionAndBuildNumber -bool true "${export_options}"
          /usr/bin/plutil -insert method -string app-store-connect "${export_options}"
          /usr/bin/plutil -insert signingStyle -string automatic "${export_options}"
          /usr/bin/plutil -insert stripSwiftSymbols -bool true "${export_options}"
          /usr/bin/plutil -insert teamID -string 7P8CLHDH5G "${export_options}"
          /usr/bin/plutil -insert testFlightInternalTestingOnly -bool false "${export_options}"
          /usr/bin/plutil -insert uploadSymbols -bool true "${export_options}"
          echo "EXPORT_OPTIONS_PATH=${export_options}" >> "${GITHUB_ENV}"

      - name: Archive PortSQL
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          /usr/bin/xcodebuild \
            -project PortSQL.xcodeproj \
            -scheme PortSQL \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${RUNNER_TEMP}/PortSQL.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}" \
            clean archive

      - name: Upload to TestFlight
        shell: bash
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail

          PATH=/usr/bin:/bin:/usr/sbin:/sbin /usr/bin/xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/PortSQL.xcarchive" \
            -exportPath "${RUNNER_TEMP}/TestFlightUpload" \
            -exportOptionsPlist "${EXPORT_OPTIONS_PATH}" \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyPath "${ASC_AUTH_KEY_PATH}"

          echo "Submitted commit \`${GITHUB_SHA:0:7}\` to App Store Connect for TestFlight processing." >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove temporary signing credentials
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -n "${ASC_AUTH_KEY_PATH:-}" && -f "${ASC_AUTH_KEY_PATH}" ]]; then
            /bin/rm -f "${ASC_AUTH_KEY_PATH}"
          fi
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" && -f "${SIGNING_KEYCHAIN_PATH}" ]]; then
            /usr/bin/security delete-keychain "${SIGNING_KEYCHAIN_PATH}"
          fi
          if [[ -n "${SIGNING_CERTIFICATE_PATH:-}" && -f "${SIGNING_CERTIFICATE_PATH}" ]]; then
            /bin/rm -f "${SIGNING_CERTIFICATE_PATH}"
          fi
